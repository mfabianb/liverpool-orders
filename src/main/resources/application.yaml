spring:
  application:
    name: orders

  data:
    mongodb:
      uri: mongodb://localhost:27017/liverpool
      host: localhost
      port: 27017
      database: liverpool
      username: admin     # MongoDB username
      password: admin     # MongoDB password
      authentication-database: admin  #Authentication database
      auto-index-creation: true   # Automatically create indexes
      write-concern: NORMAL       # Write concern level (e.g., MAJORITY, NORMAL)

external:
  orders:
    url: https://6994a4eab081bc23e9c0f61e.mockapi.io/api/v1/pedidos

  items:
    url: https://6994a4eab081bc23e9c0f61e.mockapi.io/api/v1/items

server:
  port: 8081
  servlet:
    context-path: /liverpool-orders